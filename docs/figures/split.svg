<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="splitT splitD">
<title id="splitT">Chronological train, validation and test split</title>
<desc id="splitD">A time axis from January 2015 to November 2026 divided by two date cutoffs into training, validation and test periods, drawn to scale in time, with sample counts.</desc>
<rect x="8" y="8" width="704" height="184" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

<rect x="40" y="86" width="427" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<rect x="467" y="86" width="27" height="56" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<rect x="494" y="86" width="186" height="56" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>

<text x="253" y="110" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Training</text>
<text x="253" y="130" text-anchor="middle" font-size="13" fill="#475569">2,034,604 samples</text>
<text x="587" y="110" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Test</text>
<text x="587" y="130" text-anchor="middle" font-size="13" fill="#475569">724,798 samples</text>

<path d="M480 84 V56" stroke="#d97706" stroke-width="1.4"/>
<text x="480" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Validation</text>
<text x="480" y="48" text-anchor="middle" font-size="13" fill="#475569">100,719 samples (Dec 2022 – May 2023)</text>

<path d="M40 150 H680" stroke="#475569" stroke-width="1.4"/>
<g stroke="#475569" stroke-width="1.2">
<path d="M40 150 V156"/><path d="M148 150 V156"/><path d="M256 150 V156"/><path d="M365 150 V156"/><path d="M473 150 V156"/><path d="M581 150 V156"/><path d="M689 150 V156" stroke="none"/>
</g>
<g font-size="12" fill="#475569" text-anchor="middle">
<text x="40" y="172">2015</text><text x="148" y="172">2017</text><text x="256" y="172">2019</text><text x="365" y="172">2021</text><text x="473" y="172">2023</text><text x="581" y="172">2025</text>
</g>

</svg>
