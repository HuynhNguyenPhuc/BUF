<text x="270.0" y="234" text-anchor="middle" font-size="12" fill="#475569"><tspan font-size="12">250 weights, one per input value</tspan></text>
<text x="430" y="120" text-anchor="start" font-size="13" fill="#1e293b"><tspan font-size="13">prediction = intercept + sum of weight × value</tspan></text>
<text x="430" y="150" text-anchor="start" font-size="13" fill="#1e293b"><tspan font-size="13">penalty α = 10 on the weights</tspan></text>
<text x="430" y="180" text-anchor="start" font-size="13" fill="#1e293b"><tspan font-size="13">no hidden layer, no nonlinearity</tspan></text>
<text x="430" y="210" text-anchor="start" font-size="13" fill="#475569"><tspan font-size="13">intercept is not penalised</tspan></text>
<text x="24" y="270" text-anchor="start" font-size="11" fill="#475569"><tspan font-size="11">Features: return is the log change in close; open, high and low are log ratios to the previous</tspan></text>
<text x="24" y="286" text-anchor="start" font-size="11" fill="#475569"><tspan font-size="11">close; volume is log(1 + V). All five are standardised on the training split.</tspan></text>
