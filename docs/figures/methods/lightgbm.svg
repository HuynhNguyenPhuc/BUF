<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 492" width="720" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img">
<title>LightGBM: boosted trees grown leaf-wise, with early stopping</title>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs>
<rect x="8" y="8" width="704" height="476" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="24" y="36" text-anchor="start" font-size="15" fill="#1e293b" font-weight="600"><tspan font-size="15">LightGBM: additive trees, grown leaf-wise, with early stopping</tspan></text>
<rect x="24" y="56" width="200" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="124.0" y="76.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">Window, 250 values</tspan></text>
<path d="M124.0 90.0 L124.0 112.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="24" y="112" width="200" height="34" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.2"/>
<text x="124.0" y="132.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">F</tspan><tspan dy="3.5" font-size="7.7">0</tspan><tspan dy="-3.5" font-size="11"> = mean of the targets</tspan></text>
<path d="M124.0 146.0 L124.0 168.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="24" y="168" width="200" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="124.0" y="188.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">f</tspan><tspan dy="3.5" font-size="7.7">1</tspan><tspan dy="-3.5" font-size="11"> fits the errors of F</tspan><tspan dy="3.5" font-size="7.7">0</tspan></text>
<path d="M124.0 202.0 L124.0 224.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="24" y="224" width="200" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="124.0" y="244.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">f</tspan><tspan dy="3.5" font-size="7.7">2</tspan><tspan dy="-3.5" font-size="11"> fits the errors of F</tspan><tspan dy="3.5" font-size="7.7">1</tspan></text>
<path d="M124.0 258.0 L124.0 280.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="24" y="280" width="200" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="124.0" y="300.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">… up to 1,000 rounds</tspan></text>
<path d="M124.0 314.0 L124.0 336.0" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="24" y="336" width="200" height="34" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.2"/>
<text x="124.0" y="356.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">F</tspan><tspan dy="3.5" font-size="7.7">M</tspan><tspan dy="-3.5" font-size="11"> = F</tspan><tspan dy="3.5" font-size="7.7">0</tspan><tspan dy="-3.5" font-size="11"> + η · Σ f</tspan><tspan dy="3.5" font-size="7.7">m</tspan><tspan dy="-3.5" font-size="11">,  η = 0.03</tspan></text>
<text x="24" y="444" text-anchor="start" font-size="11" fill="#475569"><tspan font-size="11">Each tree sees a random 80% of the rows and 50% of the features.</tspan></text>
<rect x="230" y="56" width="250" height="350" rx="8" fill="none" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.6"/>
<text x="355" y="80" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600"><tspan font-size="12">One tree, grown leaf-wise</tspan></text>
<rect x="300" y="100" width="100" height="26" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="350.0" y="116.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">split 1</tspan></text>
<path d="M350.0 126.0 L278.0 168.0" fill="none" stroke="#475569" stroke-width="1.4"/>
<path d="M350.0 126.0 L412.0 168.0" fill="none" stroke="#475569" stroke-width="1.4"/>
<rect x="240" y="168" width="76" height="26" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="278.0" y="184.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">split 2</tspan></text>
<rect x="384" y="168" width="56" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="412.0" y="184.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">leaf</tspan></text>
<path d="M278.0 194.0 L266.0 236.0" fill="none" stroke="#475569" stroke-width="1.4"/>
<path d="M278.0 194.0 L338.0 236.0" fill="none" stroke="#475569" stroke-width="1.4"/>
<rect x="238" y="236" width="56" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="266.0" y="252.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">leaf</tspan></text>
<rect x="300" y="236" width="76" height="26" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="338.0" y="252.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">split 3</tspan></text>
<path d="M338.0 262.0 L318.0 304.0" fill="none" stroke="#475569" stroke-width="1.4"/>
<path d="M338.0 262.0 L384.0 304.0" fill="none" stroke="#475569" stroke-width="1.4"/>
<rect x="290" y="304" width="56" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="318.0" y="320.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">leaf</tspan></text>
<rect x="356" y="304" width="56" height="26" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="384.0" y="320.85" text-anchor="middle" font-size="11" fill="#1e293b"><tspan font-size="11">leaf</tspan></text>
<text x="355" y="360" text-anchor="middle" font-size="11" fill="#475569"><tspan font-size="11">each split goes to the leaf with the largest gain</tspan></text>
<text x="355" y="378" text-anchor="middle" font-size="11" fill="#475569"><tspan font-size="11">at most 63 leaves</tspan></text>
<text x="355" y="396" text-anchor="middle" font-size="11" fill="#475569"><tspan font-size="11">at least 200 samples per leaf</tspan></text>
<rect x="500" y="56" width="200" height="350" rx="8" fill="none" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.6"/>
<text x="600" y="80" text-anchor="middle" font-size="12" fill="#1e293b" font-weight="600"><tspan font-size="12">Validation loss (schematic)</tspan></text>
<path d="M520.0 110.0 L520.0 330.0 L690.0 330.0" fill="none" stroke="#475569" stroke-width="1.4"/>
<path d="M520.0 140.0 L545.0 190.0 L575.0 230.0 L600.0 252.0 L615.0 258.0 L640.0 262.0 L690.0 264.0" fill="none" stroke="#2563eb" stroke-width="1.4"/>
<path d="M612.0 112.0 L612.0 330.0" fill="none" stroke="#db2777" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="612" y="104" text-anchor="middle" font-size="11" fill="#db2777"><tspan font-size="11">best round</tspan></text>
<text x="600" y="356" text-anchor="middle" font-size="11" fill="#475569"><tspan font-size="11">stop after 50 rounds</tspan></text>
<text x="600" y="372" text-anchor="middle" font-size="11" fill="#475569"><tspan font-size="11">without improvement</tspan></text>
<text x="360" y="468" text-anchor="middle" font-size="12" fill="#475569"><tspan font-size="12">Each tree is fitted to the errors that the trees before it leave.</tspan></text>
</svg>
