<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img">
<title>Naive: predicted return zero, so the forecast price is the previous close</title>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs>
<rect x="8" y="8" width="704" height="274" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="24" y="36" text-anchor="start" font-size="15" fill="#1e293b" font-weight="600"><tspan font-size="15">Naive: the forecast is the previous close</tspan></text>
<path d="M60.0 161.0 L106.0 155.8 L152.0 159.7 L198.0 148.0 L244.0 137.6 L290.0 142.8 L336.0 135.0 L382.0 127.2 L428.0 132.4 L474.0 124.6" fill="none" stroke="#94a3b8" stroke-width="2"/>
<circle cx="474" cy="124.60000000000001" r="5" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.2"/>
<text x="474" y="110.60000000000001" text-anchor="middle" font-size="13" fill="#475569"><tspan font-size="13">C</tspan><tspan dy="3.5" font-size="9.1">t−1</tspan></text>
<path d="M480.0 124.6 L562.0 124.6" fill="none" stroke="#db2777" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="570" cy="124.60000000000001" r="7" fill="#fce7f3" stroke="#db2777" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="570" y="110.60000000000001" text-anchor="middle" font-size="13" fill="#1e293b"><tspan font-size="13">Ĉ</tspan><tspan dy="3.5" font-size="9.1">t</tspan><tspan dy="-3.5" font-size="13"> = C</tspan><tspan dy="3.5" font-size="9.1">t−1</tspan></text>
<text x="360" y="246" text-anchor="middle" font-size="12" fill="#475569"><tspan font-size="12">predicted return = 0, so the forecast carries the last close forward</tspan></text>
<text x="360" y="268" text-anchor="middle" font-size="12" fill="#475569"><tspan font-size="12">No parameters and no training.</tspan></text>
</svg>
