<text x="370" y="592" text-anchor="middle" font-size="12" fill="#475569"><tspan font-size="12">r</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12">, z</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12"> = σ(affine map of [h</tspan><tspan dy="3.5" font-size="8.4">t−1</tspan><tspan dy="-3.5" font-size="12">, x</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12">])</tspan></text>
<text x="370" y="614" text-anchor="middle" font-size="12" fill="#475569"><tspan font-size="12">n</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12"> = tanh(W</tspan><tspan dy="3.5" font-size="8.4">n</tspan><tspan dy="-3.5" font-size="12"> x</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12"> + r</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12"> ⊙ U</tspan><tspan dy="3.5" font-size="8.4">n</tspan><tspan dy="-3.5" font-size="12"> h</tspan><tspan dy="3.5" font-size="8.4">t−1</tspan><tspan dy="-3.5" font-size="12">)</tspan></text>
<text x="370" y="636" text-anchor="middle" font-size="12" fill="#475569"><tspan font-size="12">h</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12"> = (1 − z</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12">) ⊙ n</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12"> + z</tspan><tspan dy="3.5" font-size="8.4">t</tspan><tspan dy="-3.5" font-size="12"> ⊙ h</tspan><tspan dy="3.5" font-size="8.4">t−1</tspan></text>
<text x="370" y="656" text-anchor="middle" font-size="11" fill="#475569"><tspan font-size="11">PyTorch's convention: the reset gate acts on the recurrent product U</tspan><tspan dy="3.5" font-size="7.7">n</tspan><tspan dy="-3.5" font-size="11"> h</tspan><tspan dy="3.5" font-size="7.7">t−1</tspan><tspan dy="-3.5" font-size="11">.</tspan></text>
<text x="370" y="674" text-anchor="middle" font-size="11" fill="#475569"><tspan font-size="11">Cho et al. (2014) exchange z</tspan><tspan dy="3.5" font-size="7.7">t</tspan><tspan dy="-3.5" font-size="11"> and 1 − z</tspan><tspan dy="3.5" font-size="7.7">t</tspan><tspan dy="-3.5" font-size="11">, and apply r</tspan><tspan dy="3.5" font-size="7.7">t</tspan><tspan dy="-3.5" font-size="11"> to h</tspan><tspan dy="3.5" font-size="7.7">t−1</tspan><tspan dy="-3.5" font-size="11"> before U</tspan><tspan dy="3.5" font-size="7.7">n</tspan><tspan dy="-3.5" font-size="11">.</tspan></text>
