<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-labelledby="taskT taskD">
<title id="taskT">One-step-ahead forecasting task</title>
<desc id="taskD">Fifty past days are the input to a method that predicts the next-day return, which is converted to a price and compared with the actual close.</desc>
<defs>
<marker id="taskArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
<marker id="taskArrowPink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#db2777"/></marker>
</defs>
<rect x="8" y="8" width="704" height="314" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

<text x="205" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Input: the last 50 trading days</text>
<path d="M40 48 H370" stroke="#2563eb" stroke-width="2"/>
<path d="M40 48 V54 M370 48 V54" stroke="#2563eb" stroke-width="2"/>
<text x="440" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#db2777">Target</text>

<g fill="#dbeafe" stroke="#2563eb">
<rect x="40" y="62" width="26" height="56" rx="3"/><rect x="72" y="62" width="26" height="56" rx="3"/><rect x="104" y="62" width="26" height="56" rx="3"/><rect x="136" y="62" width="26" height="56" rx="3"/><rect x="168" y="62" width="26" height="56" rx="3"/>
<rect x="250" y="62" width="26" height="56" rx="3"/><rect x="282" y="62" width="26" height="56" rx="3"/><rect x="314" y="62" width="26" height="56" rx="3"/><rect x="346" y="62" width="24" height="56" rx="3"/>
</g>
<text x="222" y="98" text-anchor="middle" font-size="20" fill="#475569">· · ·</text>
<rect x="427" y="62" width="26" height="56" rx="3" fill="#fce7f3" stroke="#db2777"/>

<text x="53" y="136" text-anchor="middle" font-size="12" fill="#475569">t−50</text>
<text x="358" y="136" text-anchor="middle" font-size="12" fill="#475569">t−1</text>
<text x="440" y="136" text-anchor="middle" font-size="12" fill="#475569">t</text>
<text x="205" y="154" text-anchor="middle" font-size="12" fill="#475569">each day: 4 log price ratios and log volume</text>

<path d="M205 164 V184" stroke="#475569" stroke-width="1.6" marker-end="url(#taskArrow)"/>

<rect x="125" y="188" width="160" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="205" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Method</text>

<path d="M285 211 H340" stroke="#475569" stroke-width="1.6" marker-end="url(#taskArrow)"/>
<rect x="344" y="188" width="150" height="46" rx="8" fill="#fff" stroke="#475569" stroke-width="1.4"/>
<text x="419" y="208" text-anchor="middle" font-size="13" fill="#1e293b">Predicted return</text>
<text x="419" y="225" text-anchor="middle" font-size="13" fill="#1e293b">r̂ (log return)</text>

<path d="M494 211 H530" stroke="#475569" stroke-width="1.6" marker-end="url(#taskArrow)"/>
<rect x="534" y="188" width="162" height="46" rx="8" fill="#fff" stroke="#475569" stroke-width="1.4"/>
<text x="615" y="208" text-anchor="middle" font-size="13" fill="#1e293b">Predicted close</text>
<text x="615" y="225" text-anchor="middle" font-size="12" fill="#475569">previous close × exp(r̂)</text>

<path d="M615 234 V262" stroke="#475569" stroke-width="1.6" marker-end="url(#taskArrow)"/>
<rect x="534" y="266" width="162" height="40" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.6"/>
<text x="615" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Score</text>
<path d="M453 90 H706 V286 H700" fill="none" stroke="#db2777" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#taskArrowPink)"/>
<text x="696" y="112" text-anchor="end" font-size="12" fill="#db2777">the actual close and return</text>
<text x="696" y="128" text-anchor="end" font-size="12" fill="#db2777">enter only at scoring</text>
</svg>
